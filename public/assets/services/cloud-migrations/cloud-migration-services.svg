<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="2 2"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="20" fill="#FAFAFA" stroke="#E2E8F0"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <!-- Header Bar -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="24" width="740" height="60" rx="14" fill="url(#headerGrad)" stroke="#E2E8F0"/>
    <circle cx="58" cy="54" r="5" fill="#EF4444"/>
    <circle cx="74" cy="54" r="5" fill="#F59E0B"/>
    <circle cx="90" cy="54" r="5" fill="#10B981"/>
    <text x="120" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Cloud Migration Topology</text>
    <rect x="580" y="42" width="170" height="24" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="665" y="58" font-family="monospace" font-size="11" font-weight="bold" fill="#0284C7" text-anchor="middle">AWS / Azure / GCP</text>
  </g>

  <!-- Main Canvas Area -->
  
  <!-- On-Premise Box -->
  <g filter="url(#cardShadow)">
    <rect x="80" y="150" width="200" height="210" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="180" y="190" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Source Workloads</text>
    <rect x="105" y="215" width="150" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="180" y="238" font-family="monospace" font-size="11" fill="#64748B" text-anchor="middle">Physical / VM Nodes</text>
    <rect x="105" y="265" width="150" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="180" y="288" font-family="monospace" font-size="11" fill="#64748B" text-anchor="middle">Legacy Databases</text>
  </g>
  <!-- Conduit Pipe -->
  <path d="M 280 255 L 500 255" stroke="#0284C7" stroke-width="3" stroke-dasharray="6 6"/>
  <circle cx="390" cy="255" r="22" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="390" y="260" font-family="monospace" font-size="12" font-weight="bold" fill="#0369A1" text-anchor="middle">SYNC</text>
  <!-- Cloud Landing Zone Box -->
  <g filter="url(#cardShadow)">
    <rect x="500" y="150" width="220" height="210" rx="18" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
    <text x="610" y="190" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Target Cloud Zone</text>
    <rect x="525" y="215" width="170" height="36" rx="8" fill="#F0F9FF" stroke="#BAE6FD"/>
    <text x="610" y="238" font-family="monospace" font-size="11" fill="#0369A1" text-anchor="middle">Isolated VPC &amp; Subnets</text>
    <rect x="525" y="265" width="170" height="36" rx="8" fill="#F0F9FF" stroke="#BAE6FD"/>
    <text x="610" y="288" font-family="monospace" font-size="11" fill="#0369A1" text-anchor="middle">Managed RDS Replica</text>
  </g>
    
  
  <!-- Footer Status Strip -->
  <rect x="30" y="440" width="740" height="36" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="50" cy="458" r="4" fill="#0284C7"/>
  <text x="65" y="462" font-family="monospace" font-size="11" fill="#64748B">meeqat.engineering.spec // Zero-Data-Loss Migration Conduit // Verified Standards</text>
</svg>