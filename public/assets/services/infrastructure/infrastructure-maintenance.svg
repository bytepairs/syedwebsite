<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="2 2"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="20" fill="#FAFAFA" stroke="#E2E8F0"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <!-- Header Bar -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="24" width="740" height="60" rx="14" fill="url(#headerGrad)" stroke="#E2E8F0"/>
    <circle cx="58" cy="54" r="5" fill="#EF4444"/>
    <circle cx="74" cy="54" r="5" fill="#F59E0B"/>
    <circle cx="90" cy="54" r="5" fill="#10B981"/>
    <text x="120" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Infrastructure Maintenance Matrix</text>
    <rect x="580" y="42" width="170" height="24" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="665" y="58" font-family="monospace" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">SLA Monitored</text>
  </g>

  <!-- Main Canvas Area -->
  
  <g filter="url(#cardShadow)">
    <rect x="100" y="130" width="600" height="75" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="125" y="152" width="32" height="32" rx="8" fill="#EFF6FF"/>
    <text x="175" y="165" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Compute Clusters</text>
    <text x="175" y="184" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Kernel patches scheduled &amp; security baselines verified</text>
    <rect x="560" y="150" width="115" height="26" rx="6" fill="#ECFDF5"/>
    <text x="617" y="167" font-family="monospace" font-size="10" font-weight="bold" fill="#047857" text-anchor="middle">HEALTHY</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="100" y="225" width="600" height="75" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="125" y="247" width="32" height="32" rx="8" fill="#ECFDF5"/>
    <text x="175" y="260" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Synthetic Uptime Telemetry</text>
    <text x="175" y="279" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Continuous HTTP, SSL expiry, and port availability probes</text>
    <rect x="560" y="245" width="115" height="26" rx="6" fill="#EFF6FF"/>
    <text x="617" y="262" font-family="monospace" font-size="10" font-weight="bold" fill="#1D4ED8" text-anchor="middle">PING: 18ms</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="100" y="320" width="600" height="75" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="125" y="342" width="32" height="32" rx="8" fill="#FFFBEB"/>
    <text x="175" y="355" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Automated Offsite Snapshots</text>
    <text x="175" y="374" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Daily encrypted database exports tested for point-in-time recovery</text>
    <rect x="560" y="340" width="115" height="26" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="617" y="357" font-family="monospace" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">ENCRYPTED</text>
  </g>
    
  
  <!-- Footer Status Strip -->
  <rect x="30" y="440" width="740" height="36" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="50" cy="458" r="4" fill="#475569"/>
  <text x="65" y="462" font-family="monospace" font-size="11" fill="#64748B">meeqat.engineering.spec // Proactive Server Telemetry & Backup Verification // Verified Standards</text>
</svg>