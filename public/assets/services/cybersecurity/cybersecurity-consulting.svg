<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="2 2"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="20" fill="#FAFAFA" stroke="#E2E8F0"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <!-- Header Bar -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="24" width="740" height="60" rx="14" fill="url(#headerGrad)" stroke="#E2E8F0"/>
    <circle cx="58" cy="54" r="5" fill="#EF4444"/>
    <circle cx="74" cy="54" r="5" fill="#F59E0B"/>
    <circle cx="90" cy="54" r="5" fill="#10B981"/>
    <text x="120" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Cybersecurity Architecture</text>
    <rect x="580" y="42" width="170" height="24" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="665" y="58" font-family="monospace" font-size="11" font-weight="bold" fill="#059669" text-anchor="middle">Zero Trust</text>
  </g>

  <!-- Main Canvas Area -->
  
  <g filter="url(#cardShadow)">
    <rect x="80" y="130" width="300" height="125" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="110" y="165" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">1. Identity &amp; Access (IAM)</text>
    <text x="110" y="188" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Role-based controls &amp; mandatory MFA</text>
    <rect x="110" y="202" width="140" height="22" rx="6" fill="#ECFDF5"/>
    <text x="180" y="217" font-family="monospace" font-size="10" fill="#047857" text-anchor="middle">LEAST PRIVILEGE</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="420" y="130" width="300" height="125" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="450" y="165" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">2. Network Perimeter</text>
    <text x="450" y="188" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Cloud WAF, DDoS mitigation, closed ports</text>
    <rect x="450" y="202" width="140" height="22" rx="6" fill="#EFF6FF"/>
    <text x="520" y="217" font-family="monospace" font-size="10" fill="#1D4ED8" text-anchor="middle">FIREWALL ACTIVE</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="80" y="280" width="300" height="125" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="110" y="315" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">3. Application Security</text>
    <text x="110" y="338" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">OWASP Top 10 scans &amp; dependency checks</text>
    <rect x="110" y="352" width="140" height="22" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="180" y="367" font-family="monospace" font-size="10" fill="#475569" text-anchor="middle">CODE SANITIZED</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="420" y="280" width="300" height="125" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="450" y="315" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">4. Data at Rest &amp; Transit</text>
    <text x="450" y="338" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">TLS 1.3 encryption &amp; KMS secret vaults</text>
    <rect x="450" y="352" width="140" height="22" rx="6" fill="#ECFDF5"/>
    <text x="520" y="367" font-family="monospace" font-size="10" fill="#047857" text-anchor="middle">AES-256 VAULT</text>
  </g>
    
  
  <!-- Footer Status Strip -->
  <rect x="30" y="440" width="740" height="36" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="50" cy="458" r="4" fill="#059669"/>
  <text x="65" y="462" font-family="monospace" font-size="11" fill="#64748B">meeqat.engineering.spec // Layered Defense & Zero-Trust Governance // Verified Standards</text>
</svg>