<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="2 2"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="20" fill="#FAFAFA" stroke="#E2E8F0"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <!-- Header Bar -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="24" width="740" height="60" rx="14" fill="url(#headerGrad)" stroke="#E2E8F0"/>
    <circle cx="58" cy="54" r="5" fill="#EF4444"/>
    <circle cx="74" cy="54" r="5" fill="#F59E0B"/>
    <circle cx="90" cy="54" r="5" fill="#10B981"/>
    <text x="120" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Support Services Workflow</text>
    <rect x="580" y="42" width="170" height="24" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="665" y="58" font-family="monospace" font-size="11" font-weight="bold" fill="#D97706" text-anchor="middle">SLA Governed</text>
  </g>

  <!-- Main Canvas Area -->
  
  <path d="M 230 250 L 370 250 M 470 250 L 610 250" stroke="#CBD5E1" stroke-width="2"/>
  <g filter="url(#cardShadow)">
    <rect x="80" y="170" width="160" height="160" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="160" y="225" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">1. Request</text>
    <text x="160" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Portal / Email / WhatsApp</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="320" y="170" width="160" height="160" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <text x="400" y="225" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">2. Triage</text>
    <text x="400" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#D97706" text-anchor="middle">Severity Scored</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="560" y="170" width="160" height="160" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
    <text x="640" y="225" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">3. Hotfix SLA</text>
    <text x="640" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#059669" text-anchor="middle">Lead Engineer Resolves</text>
  </g>
    
  
  <!-- Footer Status Strip -->
  <rect x="30" y="440" width="740" height="36" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="50" cy="458" r="4" fill="#D97706"/>
  <text x="65" y="462" font-family="monospace" font-size="11" fill="#64748B">meeqat.engineering.spec // Structured Escalation Protocol // Verified Standards</text>
</svg>