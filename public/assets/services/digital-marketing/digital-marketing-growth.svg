    <text x="455" y="315" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">GA4 Telemetry</text>
    <text x="455" y="338" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Real conversions tracked, zero vanity metrics</text>
  </g>
    
  
