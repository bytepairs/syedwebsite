<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="2 2"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="20" fill="#FAFAFA" stroke="#E2E8F0"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <!-- Header Bar -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="24" width="740" height="60" rx="14" fill="url(#headerGrad)" stroke="#E2E8F0"/>
    <circle cx="58" cy="54" r="5" fill="#EF4444"/>
    <circle cx="74" cy="54" r="5" fill="#F59E0B"/>
    <circle cx="90" cy="54" r="5" fill="#10B981"/>
    <text x="120" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Website Development Architecture</text>
    <rect x="580" y="42" width="170" height="24" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="665" y="58" font-family="monospace" font-size="11" font-weight="bold" fill="#2563EB" text-anchor="middle">Core Web Vitals</text>
  </g>

  <!-- Main Canvas Area -->
  
  <!-- Desktop Frame -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="110" width="420" height="280" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="60" y="110" width="420" height="34" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="85" cy="127" r="4" fill="#94A3B8"/><circle cx="97" cy="127" r="4" fill="#94A3B8"/><circle cx="109" cy="127" r="4" fill="#94A3B8"/>
    <rect x="130" y="120" width="220" height="15" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="90" y="165" width="200" height="24" rx="6" fill="#DBEAFE"/>
    <rect x="90" y="200" width="260" height="12" rx="4" fill="#F1F5F9"/>
    <rect x="90" y="220" width="230" height="12" rx="4" fill="#F1F5F9"/>
    <rect x="90" y="250" width="110" height="32" rx="8" fill="#1E293B"/>
    <rect x="310" y="165" width="140" height="180" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
  </g>
  <!-- Tablet Frame -->
  <g filter="url(#cardShadow)">
    <rect x="495" y="130" width="140" height="210" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="515" y="150" width="100" height="14" rx="4" fill="#DBEAFE"/>
    <rect x="515" y="172" width="100" height="60" rx="8" fill="#F1F5F9"/>
    <rect x="515" y="242" width="80" height="10" rx="3" fill="#E2E8F0"/>
  </g>
  <!-- Mobile Frame -->
  <g filter="url(#cardShadow)">
    <rect x="650" y="160" width="90" height="180" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <rect x="665" y="180" width="60" height="10" rx="3" fill="#2563EB"/>
    <rect x="665" y="198" width="60" height="50" rx="6" fill="#F1F5F9"/>
  </g>
    
  
  <!-- Footer Status Strip -->
  <rect x="30" y="440" width="740" height="36" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="50" cy="458" r="4" fill="#2563EB"/>
  <text x="65" y="462" font-family="monospace" font-size="11" fill="#64748B">meeqat.engineering.spec // Multi-Viewport Responsive System // Verified Standards</text>
</svg>