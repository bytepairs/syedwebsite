<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="2 2"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="20" fill="#FAFAFA" stroke="#E2E8F0"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <!-- Header Bar -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="24" width="740" height="60" rx="14" fill="url(#headerGrad)" stroke="#E2E8F0"/>
    <circle cx="58" cy="54" r="5" fill="#EF4444"/>
    <circle cx="74" cy="54" r="5" fill="#F59E0B"/>
    <circle cx="90" cy="54" r="5" fill="#10B981"/>
    <text x="120" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Retail & E-commerce System</text>
    <rect x="580" y="42" width="170" height="24" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="665" y="58" font-family="monospace" font-size="11" font-weight="bold" fill="#2563EB" text-anchor="middle">Retail Flow</text>
  </g>

  <!-- Main Canvas Area -->
  
  <g filter="url(#cardShadow)">
    <rect x="100" y="160" width="180" height="180" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="190" y="230" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Online Store</text>
    <text x="190" y="255" font-family="system-ui, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Mobile-Optimized</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="310" y="160" width="180" height="180" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="400" y="230" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Inventory Hub</text>
    <text x="400" y="255" font-family="system-ui, sans-serif" font-size="11" fill="#2563EB" text-anchor="middle">POS &amp; Web Sync</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="520" y="160" width="180" height="180" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="610" y="230" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Logistics</text>
    <text x="610" y="255" font-family="system-ui, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Courier Integrations</text>
  </g>
    
  
  <!-- Footer Status Strip -->
  <rect x="30" y="440" width="740" height="36" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="50" cy="458" r="4" fill="#2563EB"/>
  <text x="65" y="462" font-family="monospace" font-size="11" fill="#64748B">meeqat.engineering.spec // Omnichannel Inventory & Unified Checkout // Verified Standards</text>
</svg>